plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server { property 'forge.enabledGameTestNamespaces', mod_id; args '--nogui' }
    }
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    gradlePluginPortal()
    maven { url 'https://maven.minecraftforge.net/' }
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url 'https://maven.parchmentmc.org' }
    maven {
        url 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly files('libs/appliedenergistics2-forge-1.20.1-15.267.4.jar')
    compileOnly files('libs/RecipeSearch-1.3.jar')
    compileOnly files('libs/gtmthings-forge-1.20.1-26.7.1.jar')
    compileOnly fg.deobf('curse.maven:jade-324717:6855440')
    implementation fg.deobf(files('libs/configuration-forge-1.20.1-3.1.0.jar'))
    implementation fg.deobf(files('libs/ldlib-forge-1.20.1-1.0.50.jar'))
    implementation fg.deobf(files('libs/gtceu-forge-1.20.1-26.7.3.jar'))
    implementation fg.deobf(files('libs/gtolib-forge-1.20.1-26.7.4.jar'))
    implementation fg.deobf(files('libs/gtocore-forge-1.20.1-0.5.6-beta.jar'))
    // Match GTOCore's Kotlin ABI; the runtime is supplied by the GTO client/Kotlin-for-Forge setup.
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.3.20'
    testImplementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.20'
}

// GTOCore keeps Kotlin sources beside Java sources. Keep the same layout for the
// migrated helpers while compiling Kotlin before Java so @JvmStatic APIs remain
// available to the existing Java registration classes.
sourceSets {
    main {
        kotlin {
            srcDirs('src/main/kotlin', 'src/main/java')
        }
    }
}

kotlin {
    jvmToolchain(21)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        javaParameters.set(true)
    }
}

tasks.named('compileJava', JavaCompile).configure {
    dependsOn tasks.named('compileKotlin')
    classpath += files(tasks.named('compileKotlin').map { it.destinationDirectory })
}

// A stale generated package would compile successfully but evade discovery.
def verifyRecipePackages = tasks.register('verifyRecipePackages') {
    inputs.files(fileTree('src/main') { include '**/*.java', '**/*.kt' })
    doLast {
        def stale = inputs.files.files.findAll {
            it.getText('UTF-8') =~ /(?m)^\s*package\s+com\.gtohjs\.gtrecipe(?:\s*;|\s*$|\.)/
        }
        if (!stale.empty) {
            throw new GradleException('Recipe sources must use com.gtohjs.recipes: ' +
                    stale.collect { project.relativePath(it) }.sort().join(', '))
        }
    }
}
tasks.named('compileJava') { dependsOn verifyRecipePackages }
tasks.named('compileKotlin') { dependsOn verifyRecipePackages }

tasks.register('verifyOptimizationContracts', JavaExec) {
    group = 'verification'
    description = 'Checks the actual cooperative queue, lifecycle, routing and bounded-cache contracts.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gtohjs.machine.wildcard.OptimizationContractChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn tasks.named('verifyOptimizationContracts') }

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def encodedTextures = [
        (file('src/main/encoded-assets/infinite_wireless_energy_storage_unit.png.b64')):
            'assets/gtohjs/textures/block/infinite_wireless_energy_storage_unit.png',
        (file('src/main/encoded-assets/dev15_widget_icons.png.b64')):
            'assets/gtohjs/textures/gui/dev15_widget_icons.png',
        (file('src/main/encoded-assets/biochemical_extraction_marker.png.b64')):
            'assets/gtohjs/textures/item/biochemical_extraction_marker.png',
        (file('src/main/encoded-assets/biochemical_reaction_marker.png.b64')):
            'assets/gtohjs/textures/item/biochemical_reaction_marker.png',
        (file('src/main/encoded-assets/incubator_marker.png.b64')):
            'assets/gtohjs/textures/item/incubator_marker.png',
    ]
    inputs.files(encodedTextures.keySet())
    doLast {
        encodedTextures.each { source, path ->
            def texture = new File(destinationDir, path)
            texture.parentFile.mkdirs()
            texture.bytes = java.util.Base64.getDecoder().decode(source.text.trim())
        }
    }
    def replacements = [
        minecraft_version_range: minecraft_version_range,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
    ]
    inputs.properties replacements
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replacements + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE_GTOHJS' }
    }
    from('LICENSE_ASSETS.md') {
        into 'META-INF'
        rename { 'LICENSE_ASSETS_GTOHJS.md' }
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY_NOTICES_GTOHJS.md' }
    }
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': 'gtohjs.mixins.json',
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xlint:-removal', '-Xlint:-deprecation']
}
